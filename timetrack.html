<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTrack - Teamsive Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <style>
        :root {
            --primary: #00ffc3;
            --primary-hover: #00e6af;
            --bg-dark: #0b0f14;
            --bg-card: #141a22;
            --text: #ffffff;
            --text-muted: #8b92a0;
            --border: #1e2530;
        }

        body.light-mode {
            --bg-dark: #f0f2f5;
            --bg-card: #ffffff;
            --text: #1a1d21;
            --text-muted: #6c757d;
            --border: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            min-height: 72px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 195, 0.08);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .content {
            min-height: calc(100vh - 72px);
            width: 100%;
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 14px 16px;
            }

            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <header class="top-bar">
        <button class="back-button" onclick="goBack()" type="button">
            <span aria-hidden="true">&lt;</span>
            <span>Back</span>
        </button>
        <h1 data-i18n="timetrack">TimeTrack</h1>
    </header>

    <main class="content"></main>

    <script>
        if (localStorage.getItem("admin") !== "true") {
            location.href = "index.html";
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            location.href = "dashboard.html";
        }
    </script>
</body>

</html>
