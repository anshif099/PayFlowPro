<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTrack - Teamsive Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <script src="lang.js"></script>
    <style>
        :root {
            --primary: #00ffc3;
            --primary-hover: #00e6af;
            --bg-dark: #0b0f14;
            --bg-card: #141a22;
            --bg-input: #0f151d;
            --text: #ffffff;
            --text-muted: #8b92a0;
            --border: #1e2530;
            --danger: #ff5c5c;
        }

        body.light-mode {
            --bg-dark: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #f8f9fa;
            --text: #1a1d21;
            --text-muted: #6c757d;
            --border: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            min-height: 72px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .back-button,
        .ghost-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-button:hover,
        .ghost-button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 195, 0.08);
        }

        .add-project-button,
        .primary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 9px 16px;
            border: 1px solid var(--primary);
            border-radius: 8px;
            background: var(--primary);
            color: #000000;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .add-project-button {
            margin-left: auto;
        }

        .add-project-button:hover,
        .primary-button:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .danger-button {
            border-color: rgba(255, 92, 92, 0.35);
            color: var(--danger);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .content {
            min-height: calc(100vh - 72px);
            width: 100%;
            padding: 24px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, minmax(260px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .kanban-column {
            min-height: calc(100vh - 132px);
        }

        .column-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text);
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .task-card:hover {
            border-color: rgba(0, 255, 195, 0.45);
        }

        .task-card h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .status-select {
            width: 100%;
            min-height: 36px;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-input);
            color: var(--text);
            padding: 8px;
            font: inherit;
            font-size: 13px;
        }

        .project-card,
        .empty-card,
        .work-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .project-card h3,
        .work-card h4 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        body.light-mode .progress-bar-track {
            background: rgba(0,0,0,0.06);
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 6px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .progress-bar-fill.complete {
            background: #4caf50;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .progress-row .progress-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }

        .progress-row .progress-text.complete {
            color: #4caf50;
        }

        .muted {
            color: var(--text-muted);
            font-size: 13px;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0, 255, 195, 0.12);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(760px, 100%);
            max-height: 92vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        .modal.fullscreen {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            border-radius: 0;
            border: none;
        }

        .modal-header,
        .modal-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            flex: 1;
            font-size: 18px;
        }

        .modal-actions {
            justify-content: flex-end;
            border-top: 1px solid var(--border);
            border-bottom: none;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .modal.fullscreen .modal-body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-input);
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .section-title {
            margin: 18px 0 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .work-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .work-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .work-card-header > div {
            flex: 1;
        }

        .employee-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .employee-chip {
            position: relative;
        }

        .employee-chip input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .employee-chip span {
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--bg-card);
            font-size: 13px;
            cursor: pointer;
        }

        .employee-chip input:checked + span {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 195, 0.12);
            font-weight: 700;
        }

        .hidden {
            display: none;
        }

        .detail-modal {
            /* Now handled by .modal.fullscreen */
        }

        .detail-meta {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }

        .detail-works {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .detail-work {
            flex: 0 0 230px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }

        .chat-panel {
            display: grid;
            grid-template-rows: 1fr auto;
            flex: 1;
            min-height: 0;
        }

        .chat-messages {
            overflow-y: auto;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .chat-bubble {
            max-width: 74%;
            margin-bottom: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .chat-bubble.me {
            margin-left: auto;
            background: rgba(0, 255, 195, 0.12);
            border-color: rgba(0, 255, 195, 0.24);
        }

        .chat-name {
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .chat-time {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 6px;
        }

        .chat-image {
            max-width: 220px;
            border-radius: 10px;
            display: block;
        }

        .reply-box {
            margin-bottom: 6px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 12px;
        }

        .chat-composer {
            padding-top: 10px;
        }

        .mention-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .mention-chip {
            flex: 0 0 auto;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            border-radius: 999px;
            padding: 7px 11px;
            cursor: pointer;
            font-weight: 700;
        }

        .mention-chip.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 195, 0.12);
        }

        .replying {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-muted);
            font-size: 12px;
        }

        .replying.show {
            display: flex;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input-row input[type="text"] {
            flex: 1;
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 14px 16px;
            }

            h1 {
                font-size: 18px;
            }

            .content {
                padding: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .kanban-board {
                grid-template-columns: 1fr;
            }

            .kanban-column {
                min-height: 0;
            }

            .chat-bubble {
                max-width: 90%;
            }
        }

        @media (max-width: 420px) {
            .top-bar {
                gap: 10px;
            }

            .add-project-button {
                padding: 9px 12px;
            }

            .add-project-button .button-label {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header class="top-bar">
        <button class="back-button" onclick="goBack()" type="button">
            <span aria-hidden="true">&lt;</span>
            <span>Back</span>
        </button>
        <h1 data-i18n="timetrack">TimeTrack</h1>
        <button class="add-project-button" onclick="openCreateProject()" type="button" aria-label="Add Project">
            <span aria-hidden="true">+</span>
            <span class="button-label">Add Project</span>
        </button>
        <button class="ghost-button" style="color:var(--primary);border-color:var(--primary);" onclick="openProjectSelector()" type="button">
            <span class="button-label">Summary</span>
        </button>
    </header>

    <main class="content">
        <div id="projectList" class="project-grid">
            <div class="empty-card muted">Loading TimeTrack projects...</div>
        </div>
    </main>

    <div class="modal-overlay" id="projectModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Project</h2>
                <button class="ghost-button" onclick="closeCreateProject()" type="button">Close</button>
            </div>

            <div class="modal-body">
                <section id="projectStep">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="projectTitle">Project Title</label>
                            <input id="projectTitle" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="projectStart">Start Date</label>
                            <input type="date" id="projectStart">
                        </div>
                        <div class="form-group">
                            <label for="projectEnd">End Date</label>
                            <input type="date" id="projectEnd">
                        </div>
                    </div>

                    <div class="section-title">Work Creating</div>
                    <div class="form-grid">
                        <div class="form-group full">
                            <label for="workName">Work Name</label>
                            <input id="workName" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="workStart">Work Start Date</label>
                            <input type="date" id="workStart">
                        </div>
                        <div class="form-group">
                            <label for="workEnd">Work End Date</label>
                            <input type="date" id="workEnd">
                        </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;margin-top:12px;">
                        <button class="ghost-button" onclick="addWorkDraft()" type="button">+ Add Work</button>
                    </div>
                    <div class="work-list" id="workDraftList"></div>
                </section>

                <section id="assignmentStep" class="hidden">
                    <div class="work-list" id="assignmentList"></div>
                </section>
            </div>

            <div class="modal-actions">
                <button class="ghost-button hidden" id="backBtn" onclick="goProjectStep()" type="button">Back</button>
                <button class="ghost-button" onclick="closeCreateProject()" type="button">Close</button>
                <button class="primary-button" id="nextBtn" onclick="goAssignmentStep()" type="button">Next</button>
                <button class="primary-button hidden" id="sendBtn" onclick="saveProject()" type="button">Send</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal detail-modal fullscreen">
            <div class="modal-header">
                <div style="flex:1;">
                    <h2 id="detailTitle">Project</h2>
                    <div class="detail-meta" id="detailMeta"></div>
                </div>
                <button class="ghost-button" style="color:var(--primary);border-color:var(--primary);" onclick="getAIProjectSummary(currentProject?.id)" type="button">Summary</button>
                <button class="ghost-button danger-button" onclick="deleteProject(currentProject?.id)" type="button">Delete Project</button>
                <button class="ghost-button" onclick="closeProjectDetail()" type="button">Close</button>
            </div>
            <div class="modal-body">
                <div class="detail-works" id="detailWorks"></div>
                <div class="chat-panel">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-composer">
                        <div class="mention-row" id="mentionRow"></div>
                        <div class="replying" id="replyingBox">
                            <span id="replyingText"></span>
                            <button class="ghost-button" onclick="clearReply()" type="button" style="min-height:30px;padding:4px 8px;">Clear</button>
                        </div>
                        <div class="chat-input-row">
                            <button class="ghost-button" onclick="document.getElementById('chatImageInput').click()" type="button">Image</button>
                            <input type="file" id="chatImageInput" accept="image/*" style="display:none;">
                            <button class="ghost-button" id="voiceBtn" onclick="toggleVoiceRecord()" type="button">Voice</button>
                            <input type="text" id="chatText" placeholder="Send group message...">
                            <button class="primary-button" onclick="sendChatText()" type="button">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="summaryModal">
        <div class="modal detail-modal fullscreen">
            <div class="modal-header">
                <h2 style="flex:1;">AI Summary & Analytics</h2>
                <button class="ghost-button" onclick="$('summaryModal').classList.remove('show')" type="button">Close</button>
            </div>
            <div class="modal-body" id="summaryBody" style="max-height: 80vh; overflow-y: auto;">
                <div id="summaryChart" style="margin-bottom: 24px;"></div>
                <div id="summaryText" style="line-height: 1.8; white-space: pre-wrap; font-size: 15px; color: var(--text);">Generating summary...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="projectSelectorModal">
        <div class="modal" style="width: min(450px, 95%);">
            <div class="modal-header">
                <h2 style="flex:1;">Select Project</h2>
                <button class="ghost-button" onclick="$('projectSelectorModal').classList.remove('show')" type="button">Close</button>
            </div>
            <div class="modal-body" id="projectSelectorList" style="max-height: 60vh; overflow-y: auto; padding: 12px;">
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem("admin") !== "true") {
            location.href = "index.html";
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            location.href = "dashboard.html";
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getDatabase, ref, get, onValue, push, update, remove, off, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADjMc3Jwsjlg_ajo282ZtM5jvDUuGdoRk",
            authDomain: "payflowpro-6e62d.firebaseapp.com",
            databaseURL: "https://payflowpro-6e62d-default-rtdb.firebaseio.com",
            projectId: "payflowpro-6e62d",
            storageBucket: "payflowpro-6e62d.firebasestorage.app",
            messagingSenderId: "69298740438",
            appId: "1:69298740438:web:18fd85e982e083e1543d77"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const role = localStorage.getItem("role") || "";
        const companyId = (localStorage.getItem("companyId") || "").trim().toLowerCase();
        const adminBranch = localStorage.getItem("branch") || "";
        const adminName = localStorage.getItem("name") || "Admin";
        const scopeId = companyId || safeKey(adminBranch || role || "global");

        let employees = [];
        let works = [];
        let saving = false;
        let cachedProjects = [];
        let currentProject = null;
        let currentChatRef = null;
        let mentionIds = new Set();
        let replyToMessage = null;
        let mediaRecorder = null;
        let audioChunks = [];

        const STATUS_ORDER = ["todo", "in_progress", "in_review", "finish"];

        window.$ = (id) => document.getElementById(id);
        window.esc = (value) => (value || "").toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value + "T00:00:00");
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function showError(message) {
            alert(message);
        }

        function statusLabel(status) {
            if (status === "in_progress") return "In Progress";
            if (status === "in_review") return "In Review";
            if (status === "finish") return "Finish";
            return "To Do";
        }

        function safeKey(value) {
            const key = String(value || "").trim().toLowerCase().replace(/[.#$\[\]\/]/g, "_");
            return key || "global";
        }

        async function loadEmployees() {
            const [employeesSnap, adminsSnap] = await Promise.all([
                get(ref(db, "employees")),
                get(ref(db, "admins"))
            ]);

            const branchAdminBranches = new Set();
            if (adminsSnap.exists()) {
                Object.values(adminsSnap.val() || {}).forEach((admin) => {
                    if (admin && admin.role === "branch_admin" && admin.branch) {
                        branchAdminBranches.add(String(admin.branch).trim());
                    }
                });
            }

            employees = [];
            if (employeesSnap.exists()) {
                Object.entries(employeesSnap.val() || {}).forEach(([key, emp]) => {
                    if (!emp || emp.status === "inactive") return;
                    const empBranch = String(emp.branch || "").trim();
                    const empCompanyId = String(emp.companyId || "").trim().toLowerCase();
                    let allow = true;

                    if (role === "branch_admin" && empBranch.toLowerCase() !== adminBranch.trim().toLowerCase()) {
                        allow = false;
                    } else if (role === "company_admin" && (empCompanyId !== companyId || branchAdminBranches.has(empBranch))) {
                        allow = false;
                    } else if (role === "super_admin" && companyId && empCompanyId && empCompanyId !== companyId) {
                        allow = false;
                    }

                    if (allow) {
                        employees.push({
                            id: key,
                            name: emp.name || "Employee",
                            branch: empBranch,
                            companyId: empCompanyId
                        });
                    }
                });
            }

            employees.sort((a, b) => a.name.localeCompare(b.name));
        }

        function watchProjects() {
            onValue(ref(db, `timetrack_projects/${scopeId}`), (snap) => {
                const projects = [];
                if (snap.exists()) {
                    Object.entries(snap.val() || {}).forEach(([id, item]) => {
                        projects.push({ id, ...item });
                    });
                }
                projects.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
                cachedProjects = projects;
                renderBoard(projects);
            });
        }

        function renderBoard(projects) {
            if (!projects.length) {
                $("projectList").innerHTML = '<div class="empty-card muted">No TimeTrack projects yet.</div>';
                return;
            }

            const boardWorks = [];
            projects.forEach((project) => {
                Object.entries(project.works || {}).forEach(([workId, work]) => {
                    boardWorks.push({
                        project,
                        projectId: project.id,
                        projectTitle: project.title || "Untitled project",
                        projectStartDate: project.startDate || "",
                        projectEndDate: project.endDate || "",
                        workId,
                        workName: work.name || "Work",
                        workStartDate: work.startDate || "",
                        workEndDate: work.endDate || "",
                        status: work.status || "todo",
                        assignedEmployeeIds: Object.keys(work.assignedEmployees || {})
                    });
                });
            });

            $("projectList").className = "kanban-board";
            $("projectList").innerHTML = STATUS_ORDER.map((status) => {
                const columnWorks = boardWorks.filter((work) => work.status === status);
                return `
                    <section class="kanban-column">
                        <div class="column-head">
                            <span>${statusLabel(status)}</span>
                            <span class="muted">${columnWorks.length}</span>
                        </div>
                        ${columnWorks.length ? columnWorks.map(renderTaskCard).join("") : '<div class="empty-card muted">No works</div>'}
                    </section>
                `;
            }).join("");
        }

        function getProjectProgress(project) {
            const worksMap = project.works || {};
            const workEntries = Object.values(worksMap);
            if (!workEntries.length) return 0;
            let total = 0;
            workEntries.forEach((work) => {
                const s = work.status || "todo";
                if (s === "in_progress") total += 0.25;
                else if (s === "in_review") total += 0.75;
                else if (s === "finish") total += 1;
            });
            return Math.round((total / workEntries.length) * 100);
        }

        function renderTaskCard(work) {
            const names = work.assignedEmployeeIds
                .map((id) => employees.find((employee) => employee.id === id)?.name || id)
                .map((name) => `<span class="pill">${esc(name)}</span>`)
                .join("");
            const progress = getProjectProgress(work.project);
            const isComplete = progress === 100;
            return `
                <article class="task-card" onclick="openProjectDetail('${esc(work.projectId)}')">
                    <h3>${esc(work.workName)}</h3>
                    <div class="muted">${esc(work.projectTitle)}</div>
                    <div class="muted" style="margin-top:8px;">${formatDate(work.workStartDate)} - ${formatDate(work.workEndDate)}</div>
                    <div class="pill-row">${names}</div>
                    <div class="progress-row">
                        <div class="progress-bar-track" style="flex:1;">
                            <div class="progress-bar-fill ${isComplete ? 'complete' : ''}" style="width:${progress}%;"></div>
                        </div>
                        <span class="progress-text ${isComplete ? 'complete' : ''}">${progress}%</span>
                    </div>
                    <select class="status-select" onclick="event.stopPropagation()" onchange="updateWorkStatus('${esc(work.projectId)}', '${esc(work.workId)}', this.value)">
                        ${STATUS_ORDER.map((status) => `<option value="${status}" ${work.status === status ? "selected" : ""}>${statusLabel(status)}</option>`).join("")}
                    </select>
                    <div class="card-actions" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
                        <button class="ghost-button" style="min-height:28px;padding:3px 8px;font-size:11px;" onclick="event.stopPropagation();reassignWork('${esc(work.projectId)}','${esc(work.workId)}')" type="button">Reassign</button>
                        <button class="ghost-button danger-button" style="min-height:28px;padding:3px 8px;font-size:11px;" onclick="event.stopPropagation();deleteWork('${esc(work.projectId)}','${esc(work.workId)}')" type="button">Delete Work</button>
                        <button class="ghost-button danger-button" style="min-height:28px;padding:3px 8px;font-size:11px;" onclick="event.stopPropagation();deleteProject('${esc(work.projectId)}')" type="button">Delete Project</button>
                    </div>
                </article>
            `;
        }

        window.updateWorkStatus = async function(projectId, workId, status) {
            const project = cachedProjects.find((item) => item.id === projectId);
            const work = project?.works?.[workId];
            if (!project || !work) return;
            const updates = {};
            updates[`timetrack_projects/${scopeId}/${projectId}/works/${workId}/status`] = status;
            Object.keys(work.assignedEmployees || {}).forEach((empId) => {
                updates[`timetrack_assignments/${empId}/${projectId}_${workId}/status`] = status;
            });
            await update(ref(db), updates);
        };

        window.deleteWork = async function(projectId, workId) {
            if (!confirm("Delete this work and remove all its assignments?")) return;
            const project = cachedProjects.find((item) => item.id === projectId);
            const work = project?.works?.[workId];
            const updates = {};
            updates[`timetrack_projects/${scopeId}/${projectId}/works/${workId}`] = null;
            if (work && work.assignedEmployees) {
                Object.keys(work.assignedEmployees).forEach((empId) => {
                    updates[`timetrack_assignments/${empId}/${projectId}_${workId}`] = null;
                });
            }
            await update(ref(db), updates);
            alert("Work deleted.");
        };

        window.deleteProject = async function(projectId) {
            if (!confirm("Delete this entire project, all works, and all assignments?")) return;
            const project = cachedProjects.find((item) => item.id === projectId);
            const updates = {};
            updates[`timetrack_projects/${scopeId}/${projectId}`] = null;
            updates[`timetrack_project_chats/${scopeId}/${projectId}`] = null;
            if (project && project.works) {
                Object.entries(project.works).forEach(([wId, work]) => {
                    if (work && work.assignedEmployees) {
                        Object.keys(work.assignedEmployees).forEach((empId) => {
                            updates[`timetrack_assignments/${empId}/${projectId}_${wId}`] = null;
                        });
                    }
                });
            }
            await update(ref(db), updates);
            closeProjectDetail();
            alert("Project deleted.");
        };

        window.reassignWork = async function(projectId, workId) {
            const project = cachedProjects.find((item) => item.id === projectId);
            const work = project?.works?.[workId];
            if (!project || !work) return;
            const currentIds = new Set(Object.keys(work.assignedEmployees || {}));
            const lines = employees.map((emp) => {
                const checked = currentIds.has(emp.id) ? "checked" : "";
                return `<label style='display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;'><input type='checkbox' class='reassign-cb' data-id='${emp.id}' ${checked}> ${esc(emp.name)}</label>`;
            }).join("");
            const overlay = document.createElement("div");
            overlay.className = "modal-overlay show";
            overlay.innerHTML = `
                <div class='modal' style='width:min(420px,95%);max-height:80vh;'>
                    <div class='modal-header'>
                        <h2 style='flex:1;font-size:16px;'>Reassign: ${esc(work.name || "Work")}</h2>
                        <button class='ghost-button' onclick='this.closest(".modal-overlay").remove()' type='button'>Close</button>
                    </div>
                    <div class='modal-body' style='overflow-y:auto;'>
                        <div id='reassignEmployees'>${lines}</div>
                    </div>
                    <div class='modal-actions'>
                        <button class='ghost-button' onclick='this.closest(".modal-overlay").remove()' type='button'>Cancel</button>
                        <button class='primary-button' id='reassignSaveBtn' type='button'>Save</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector("#reassignSaveBtn").addEventListener("click", async () => {
                const boxes = overlay.querySelectorAll(".reassign-cb");
                const selected = new Set();
                boxes.forEach((cb) => { if (cb.checked) selected.add(cb.dataset.id); });
                if (!selected.size) { showError("Select at least one employee."); return; }
                const updates = {};
                const newAssigned = {};
                selected.forEach((id) => newAssigned[id] = true);
                updates[`timetrack_projects/${scopeId}/${projectId}/works/${workId}/assignedEmployees`] = newAssigned;
                // Remove old
                currentIds.forEach((empId) => {
                    if (!selected.has(empId)) {
                        updates[`timetrack_assignments/${empId}/${projectId}_${workId}`] = null;
                    }
                });
                // Add new
                const now = new Date().toISOString();
                selected.forEach((empId) => {
                    if (!currentIds.has(empId)) {
                        updates[`timetrack_assignments/${empId}/${projectId}_${workId}`] = {
                            assignmentId: `${projectId}_${workId}`,
                            projectId, workId, companyId: scopeId,
                            projectTitle: project.title || "",
                            projectStartDate: project.startDate || "",
                            projectEndDate: project.endDate || "",
                            workName: work.name || "",
                            workStartDate: work.startDate || "",
                            workEndDate: work.endDate || "",
                            status: work.status || "todo",
                            assignedAt: now,
                            assignedBy: adminName
                        };
                    }
                });
                await update(ref(db), updates);
                overlay.remove();
                if (currentProject && currentProject.id === projectId) {
                    const snap = await get(ref(db, `timetrack_projects/${scopeId}/${projectId}`));
                    if (snap.exists()) {
                        currentProject = { id: projectId, ...snap.val() };
                        renderDetailWorks(currentProject);
                    }
                }
                alert("Work reassigned.");
            });
        };

        window.openProjectSelector = function() {
            const list = $("projectSelectorList");
            list.innerHTML = cachedProjects.length ? cachedProjects.map(p => `
                <div class="detail-work" style="cursor:pointer;margin-bottom:8px;" onclick="selectProjectForSummary('${esc(p.id)}')">
                    <h3 style="margin:0;">${esc(p.title)}</h3>
                    <div class="muted" style="font-size:11px;">${formatDate(p.startDate)} - ${formatDate(p.endDate)}</div>
                </div>
            `).join("") : `<div class="muted">No projects found.</div>`;
            $("projectSelectorModal").classList.add("show");
        };

        window.selectProjectForSummary = function(projectId) {
            $("projectSelectorModal").classList.remove("show");
            getAIProjectSummary(projectId);
        };

        window.getAIProjectSummary = async function(projectId) {
            const project = cachedProjects.find((p) => p.id === projectId);
            if (!project) return;

            $("summaryModal").classList.add("show");
            $("summaryText").textContent = "Generating summary with AI...";
            $("summaryChart").innerHTML = "";

            const workEntries = Object.values(project.works || {});
            const stats = { todo: 0, in_progress: 0, in_review: 0, finish: 0 };
            workEntries.forEach(w => stats[w.status || "todo"]++);

            // Simple status chart
            const total = workEntries.length || 1;
            $("summaryChart").innerHTML = `
                <div style="font-weight:700;margin-bottom:12px;font-size:14px;">Work Status Distribution</div>
                <div style="display:flex;height:24px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.05);">
                    <div style="width:${(stats.todo / total) * 100}%;background:#8b92a0;" title="To Do: ${stats.todo}"></div>
                    <div style="width:${(stats.in_progress / total) * 100}%;background:var(--primary);" title="In Progress: ${stats.in_progress}"></div>
                    <div style="width:${(stats.in_review / total) * 100}%;background:#f1c40f;" title="In Review: ${stats.in_review}"></div>
                    <div style="width:${(stats.finish / total) * 100}%;background:#4caf50;" title="Finished: ${stats.finish}"></div>
                </div>
                <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-muted);">
                    <span>To Do (${stats.todo})</span>
                    <span>Working (${stats.in_progress})</span>
                    <span>Review (${stats.in_review})</span>
                    <span>Done (${stats.finish})</span>
                </div>
            `;

            setTimeout(() => {
                let summaryText = "Project Overview:\n\n";
                summaryText += `• Total Works: ${total}\n`;
                summaryText += `• Completed: ${stats.finish}\n`;
                summaryText += `• In Progress: ${stats.in_progress}\n`;
                summaryText += `• In Review: ${stats.in_review}\n`;
                summaryText += `• To Do: ${stats.todo}\n\n`;

                if (total === 0) {
                    summaryText += "There are no works assigned to this project yet.";
                } else if (stats.finish === total) {
                    summaryText += "The project is fully completed. All tasks are finished.";
                } else if (stats.in_progress > 0 || stats.in_review > 0) {
                    summaryText += "The project is currently active and work is underway.";
                } else {
                    summaryText += "The project has not started yet. Tasks are waiting in the 'To Do' state.";
                }

                $("summaryText").textContent = summaryText;
            }, 300);
        };

        function resetModal() {
            works = [];
            $("projectTitle").value = "";
            $("projectStart").value = "";
            $("projectEnd").value = "";
            $("workName").value = "";
            $("workStart").value = "";
            $("workEnd").value = "";
            renderWorkDrafts();
            goProjectStep();
        }

        window.openCreateProject = async function() {
            if (!employees.length) {
                await loadEmployees();
            }
            if (!employees.length) {
                showError("No employees available to assign.");
                return;
            }
            resetModal();
            $("projectModal").classList.add("show");
        };

        window.closeCreateProject = function() {
            if (saving) return;
            $("projectModal").classList.remove("show");
        };

        function syncWorkDateLimits() {
            const start = $("projectStart").value;
            const end = $("projectEnd").value;
            $("projectEnd").min = start || "";
            $("workStart").min = start || "";
            $("workStart").max = end || "";
            $("workEnd").min = $("workStart").value || start || "";
            $("workEnd").max = end || "";
        }

        ["projectStart", "projectEnd", "workStart"].forEach((id) => {
            $(id).addEventListener("change", syncWorkDateLimits);
        });

        window.addWorkDraft = function() {
            const name = $("workName").value.trim();
            const projectStart = $("projectStart").value;
            const projectEnd = $("projectEnd").value;
            const start = $("workStart").value;
            const end = $("workEnd").value;

            if (!name) return showError("Work name is required.");
            if (!projectStart || !projectEnd) return showError("Select project dates first.");
            if (!start || !end) return showError("Select work start and end dates.");
            if (projectEnd < projectStart) return showError("Project end date must be after start date.");
            if (start < projectStart || end > projectEnd) return showError("Work dates must be inside the project dates.");
            if (end < start) return showError("Work end date must be after start date.");

            works.push({
                id: `work_${Date.now()}_${works.length}`,
                name,
                startDate: start,
                endDate: end,
                employeeIds: new Set()
            });

            $("workName").value = "";
            $("workStart").value = "";
            $("workEnd").value = "";
            renderWorkDrafts();
            syncWorkDateLimits();
        };

        function renderWorkDrafts() {
            $("workDraftList").innerHTML = works.map((work, index) => `
                <div class="work-card">
                    <div class="work-card-header">
                        <div>
                            <h4>${esc(work.name)}</h4>
                            <div class="muted">${formatDate(work.startDate)} - ${formatDate(work.endDate)}</div>
                        </div>
                        <button class="ghost-button danger-button" onclick="removeWorkDraft(${index})" type="button">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        window.removeWorkDraft = function(index) {
            works.splice(index, 1);
            renderWorkDrafts();
        };

        window.goAssignmentStep = function() {
            const title = $("projectTitle").value.trim();
            const projectStart = $("projectStart").value;
            const projectEnd = $("projectEnd").value;

            if (!title) return showError("Project title is required.");
            if (!projectStart || !projectEnd) return showError("Select project start and end dates.");
            if (projectEnd < projectStart) return showError("Project end date must be after start date.");
            if (!works.length) return showError("Add at least one work.");

            $("modalTitle").textContent = "Assign Works";
            $("projectStep").classList.add("hidden");
            $("assignmentStep").classList.remove("hidden");
            $("nextBtn").classList.add("hidden");
            $("sendBtn").classList.remove("hidden");
            $("backBtn").classList.remove("hidden");
            renderAssignments();

        window.goProjectStep = function() {
            $("modalTitle").textContent = "Add Project";
            $("projectStep").classList.remove("hidden");
            $("assignmentStep").classList.add("hidden");
            $("nextBtn").classList.remove("hidden");
            $("sendBtn").classList.add("hidden");
            $("backBtn").classList.add("hidden");
        };

        function renderAssignments() {
            $("assignmentList").innerHTML = works.map((work, workIndex) => `
                <div class="work-card">
                    <h4>${esc(work.name)}</h4>
                    <div class="muted">${formatDate(work.startDate)} - ${formatDate(work.endDate)}</div>
                    <div class="employee-grid">
                        ${employees.map((employee) => `
                            <label class="employee-chip">
                                <input type="checkbox" onchange="toggleEmployee(${workIndex}, '${esc(employee.id)}', this.checked)" ${work.employeeIds.has(employee.id) ? "checked" : ""}>
                                <span>${esc(employee.name)}</span>
                            </label>
                        `).join("")}
                    </div>
                </div>
            `).join("");
        }

        window.toggleEmployee = function(workIndex, empId, checked) {
            if (!works[workIndex]) return;
            if (checked) {
                works[workIndex].employeeIds.add(empId);
            } else {
                works[workIndex].employeeIds.delete(empId);
            }
        };

        window.saveProject = async function() {
            if (saving) return;
            if (works.some((work) => work.employeeIds.size === 0)) {
                showError("Assign employees to every work.");
                return;
            }

            saving = true;
            $("sendBtn").textContent = "Sending...";
            try {
                const projectTitle = $("projectTitle").value.trim();
                const projectStart = $("projectStart").value;
                const projectEnd = $("projectEnd").value;
                const now = new Date().toISOString();
                const projectRef = push(ref(db, `timetrack_projects/${scopeId}`));
                const projectId = projectRef.key;
                const worksData = {};
                const updates = {};

                works.forEach((work) => {
                    const assignedEmployees = {};
                    work.employeeIds.forEach((empId) => assignedEmployees[empId] = true);
                    worksData[work.id] = {
                        name: work.name,
                        startDate: work.startDate,
                        endDate: work.endDate,
                        status: "todo",
                        assignedEmployees,
                        createdAt: now
                    };

                    work.employeeIds.forEach((empId) => {
                        const assignmentId = `${projectId}_${work.id}`;
                        updates[`timetrack_assignments/${empId}/${assignmentId}`] = {
                            assignmentId,
                            projectId,
                            workId: work.id,
                            companyId: scopeId,
                            projectTitle,
                            projectStartDate: projectStart,
                            projectEndDate: projectEnd,
                            workName: work.name,
                            workStartDate: work.startDate,
                            workEndDate: work.endDate,
                            status: "todo",
                            assignedAt: now,
                            assignedBy: adminName
                        };
                    });
                });

                updates[`timetrack_projects/${scopeId}/${projectId}`] = {
                    id: projectId,
                    title: projectTitle,
                    companyId: scopeId,
                    startDate: projectStart,
                    endDate: projectEnd,
                    works: worksData,
                    createdAt: now,
                    createdBy: adminName
                };

                await update(ref(db), updates);
                $("projectModal").classList.remove("show");
                alert("Project sent to employee TimeTrack.");
            } catch (error) {
                showError("Unable to save project: " + error.message);
            } finally {
                saving = false;
                $("sendBtn").textContent = "Send";
            }
        };

        window.openProjectDetail = function(projectId) {
            const project = cachedProjects.find((item) => item.id === projectId);
            if (!project) return;
            currentProject = project;
            mentionIds = new Set();
            replyToMessage = null;
            $("detailTitle").textContent = project.title || "Project";
            $("detailMeta").textContent = `${formatDate(project.startDate)} - ${formatDate(project.endDate)}`;
            renderDetailWorks(project);
            renderMentionRow();

        window.closeProjectDetail = function() {
            $("detailModal").classList.remove("show");
            if (currentChatRef) off(currentChatRef);
            currentChatRef = null;
            currentProject = null;
        };

        function renderDetailWorks(project) {
            $("detailWorks").innerHTML = Object.entries(project.works || {}).map(([workId, work]) => `
                <div class="detail-work">
                    <h3>${esc(work.name || "Work")}</h3>
                    <div class="muted">${formatDate(work.startDate)} - ${formatDate(work.endDate)}</div>
                    <div class="pill-row">
                        <span class="pill">${statusLabel(work.status || "todo")}</span>

                    </select>

                        <button class="ghost-button danger-button" style="min-height:26px;padding:2px 7px;font-size:10px;" onclick="deleteWork('${esc(project.id)}','${esc(workId)}')" type="button">Delete</button>

            `).join("");

        function renderMentionRow() {
            $("mentionRow").innerHTML = employees.map((employee) => `
                <button class="mention-chip ${mentionIds.has(employee.id) ? "active" : ""}" onclick="toggleMention('${esc(employee.id)}')" type="button">@${esc(employee.name)}</button>
            `).join("");

        window.toggleMention = function(empId) {
            if (mentionIds.has(empId)) mentionIds.delete(empId);
            else mentionIds.add(empId);
            renderMentionRow();
        };

        function listenChat(projectId) {
            if (currentChatRef) off(currentChatRef);
            currentChatRef = ref(db, `timetrack_project_chats/${scopeId}/${projectId}`);
            onValue(currentChatRef, (snap) => {
                const messages = [];
                if (snap.exists()) {
                    Object.entries(snap.val() || {}).forEach(([id, message]) => {
                        messages.push({ id, ...message });
                    });
                }
                messages.sort((a, b) => Number(a.timestamp || 0) - Number(b.timestamp || 0));
                renderChat(messages);
            });
        }

        function renderChat(messages) {
            if (!messages.length) {
                $("chatMessages").innerHTML = '<div class="muted">No group messages yet.</div>';
                return;
            }
            $("chatMessages").innerHTML = messages.map((message) => {
                const isMe = message.senderId === scopeId;
                const time = message.timestamp ? new Date(message.timestamp).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
                const mentions = Array.isArray(message.mentionedEmployeeIds)
                    ? message.mentionedEmployeeIds.map((id) => employees.find((employee) => employee.id === id)?.name).filter(Boolean).map((name) => `@${esc(name)}`).join(" ")
                    : "";
                let body = esc(message.text || "");
                if (message.type === "image" && message.imageData) {
                    body = `<img class="chat-image" src="data:image/jpeg;base64,${message.imageData}">`;
                } else if (message.type === "audio" && message.audioData) {
                    body = `<audio controls src="data:audio/mp4;base64,${message.audioData}"></audio>`;
                }
                const reply = message.replyTo ? `<div class="reply-box">${esc(message.replyTo.senderName || "User")}: ${esc(message.replyTo.preview || "")}</div>` : "";
                return `
                    <div class="chat-bubble ${isMe ? "me" : ""}">
                        <div class="chat-name">${esc(message.senderName || "User")}</div>
                        ${reply}
                        <div>${body}</div>
                        ${mentions ? `<div class="muted" style="margin-top:6px;color:var(--primary);">${mentions}</div>` : ""}
                        <div class="chat-time">${time} 
                        ${isMe || role === "admin" || role === "super_admin" || role === "company_admin" || role === "branch_admin" ? `<button class="ghost-button danger-button" style="min-height:26px;padding:2px 7px;margin-left:6px;" onclick="deleteChatMessage('${esc(message.id)}')" type="button">Delete</button>` : ""}
                        <button class="ghost-button" style="min-height:26px;padding:2px 7px;margin-left:6px;" onclick="setReply('${esc(message.id)}')" type="button">Reply</button></div>
                    </div>
                `;
            }).join("");
            $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
            window.currentRenderedMessages = messages;
        }

        function messagePreview(message) {
            if (message.type === "image") return "Image";
            if (message.type === "audio") return "Voice message";
            const text = message.text || "";
            return text.length > 60 ? text.slice(0, 60) + "..." : text;
        }

        window.setReply = function(messageId) {
            const message = (window.currentRenderedMessages || []).find((item) => item.id === messageId);
            if (!message) return;
            replyToMessage = message;
            $("replyingText").textContent = `Replying to ${message.senderName || "User"}: ${messagePreview(message)}`;
            $("replyingBox").classList.add("show");
        };

        window.clearReply = function() {
            replyToMessage = null;
            $("replyingText").textContent = "";
            $("replyingBox").classList.remove("show");
        };

        window.deleteChatMessage = async function(messageId) {
            if (!confirm("Are you sure you want to delete this message for everyone?")) return;
            if (!currentProject) return;
            try {
                await remove(ref(db, `timetrack_project_chats/${scopeId}/${currentProject.id}/${messageId}`));
            } catch(e) {
                showError("Unable to delete message: " + e.message);
            }
        };

        async function pushChatMessage(payload) {
            if (!currentProject) return;
            const message = {
                ...payload,
                senderId: scopeId,
                senderName: adminName,
                senderType: "admin",
                mentionedEmployeeIds: Array.from(mentionIds),
                replyTo: replyToMessage ? {
                    messageId: replyToMessage.id,
                    senderName: replyToMessage.senderName || "User",
                    preview: messagePreview(replyToMessage)
                } : null,
                timestamp: serverTimestamp()
            };
            mentionIds = new Set();
            window.clearReply();
            renderMentionRow();
            await push(ref(db, `timetrack_project_chats/${scopeId}/${currentProject.id}`), message);
        }

        window.sendChatText = async function() {
            const text = $("chatText").value.trim();
            if (!text) return;
            $("chatText").value = "";
            await pushChatMessage({ type: "text", text });
        };

        $("chatImageInput").addEventListener("change", (event) => {
            const file = event.target.files?.[0];
            event.target.value = "";
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async () => {
                const result = String(reader.result || "");
                const base64 = result.split(",").pop();
                await pushChatMessage({ type: "image", imageData: base64, fileName: file.name });
            };
            reader.readAsDataURL(file);
        });

        window.toggleVoiceRecord = async function() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                $("voiceBtn").textContent = "Voice";
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach((track) => track.stop());
                    const blob = new Blob(audioChunks, { type: "audio/mp4" });
                    const reader = new FileReader();
                    reader.onload = async () => {
                        const result = String(reader.result || "");
                        const base64 = result.split(",").pop();
                        await pushChatMessage({ type: "audio", audioData: base64, fileName: `voice_${Date.now()}.m4a` });
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                $("voiceBtn").textContent = "Stop";
            } catch (error) {
                showError("Microphone access denied.");
            }
        };

        loadEmployees()
            .then(() => {
                if (cachedProjects.length) renderBoard(cachedProjects);
            })
            .catch((error) => console.error("Employee load failed", error));
        watchProjects();
    </script>
</body>

</html>
