<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamsive Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <script src="lang.js"></script>
  <style>
    :root {
      --primary: #00ffc3;
      --primary-hover: #00e6af;
      --bg-dark: #0b0f14;
      --bg-card: #141a22;
      --bg-input: #0f151d;
      --text: #ffffff;
      --text-muted: #8b92a0;
      --border: #1e2530;
      --success: #00ffc3;
      --danger: #ff5c5c;
      --warning: #ffa726;
      --sidebar-width: 260px;
    }

    body.light-mode {
      --bg-dark: #f0f2f5;
      --bg-card: #ffffff;
      --bg-input: #f8f9fa;
      --text: #1a1d21;
      --text-muted: #6c757d;
      --border: #e9ecef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden }

    .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 0; z-index: 100; overflow-y: auto; transition: transform .3s ease }
    .sidebar-header { padding: 0 24px 24px; border-bottom: 1px solid var(--border) }
    .sidebar-header h2 { color: var(--primary); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px }
    .sidebar-nav { margin-top: 24px; padding: 0 12px }
    
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: all .2s ease; font-weight: 500; font-size: 14px; text-decoration: none }
    .nav-item:hover { background: rgba(0, 255, 195, 0.1); color: var(--primary) }
    .nav-item.active { background: rgba(0, 255, 195, 0.1); color: var(--primary); font-weight: 600 }
    .nav-icon { width: 20px; height: 20px; font-size: 18px }

    .main-content { margin-left: var(--sidebar-width); min-height: 100vh; transition: margin-left .3s ease }
    .top-bar { background: var(--bg-card); padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50 }
    .top-bar h1 { font-size: 24px; font-weight: 600 }
    .menu-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 8px }

    .dashboard-section { padding: 32px }
    .card { background: var(--bg-card); border-radius: 16px; padding: 28px; margin-bottom: 24px; border: 1px solid var(--border) }
    .card h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text) }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all .2s ease }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0, 255, 195, .1) }
    .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px }
    .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(0, 255, 195, .1); color: var(--primary) }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 8px }
    .stat-label { font-size: 14px; color: var(--text-muted); font-weight: 500 }

    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all .2s ease }
    .btn-logout:hover { background: var(--danger); border-color: var(--danger); color: white }

    .table-container { overflow-x: auto; margin-top: 16px }
    table { width: 100%; border-collapse: collapse }
    th { text-align: left; padding: 14px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--border); background: rgba(0, 0, 0, .2) }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px }
    tr:hover { background: rgba(0, 255, 195, .03) }

    .badge-in { color: var(--success); background: rgba(0,255,195,0.1); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; text-transform: uppercase }
    .badge-out { color: var(--danger); background: rgba(255, 92, 92, .15); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; text-transform: uppercase }
    .badge-absent { color: #888; background: rgba(136, 136, 136, .15); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; text-transform: uppercase }

    .sub-widget { background: linear-gradient(135deg, rgba(0,255,195,0.1), rgba(20,26,34,1)); border: 1px solid var(--primary); border-radius: 12px; padding: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px }
    .sub-info { font-size: 14px }
    .sub-info strong { color: var(--primary); font-size: 16px }

    @media(max-width:768px) {
      .sidebar { transform: translateX(-100%) }
      .sidebar.open { transform: translateX(0) }
      .main-content { margin-left: 0 }
      .menu-toggle { display: block }
    }
  </style>
</head>

<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>💼 Teamsive</h2>
    </div>
    <nav class="sidebar-nav" id="nav-content">
        <!-- Sidebar links will be here -->
    </nav>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:16px">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h1 data-i18n="dashboard">Dashboard</h1>
      </div>
      <div class="top-bar-actions">
        <button class="btn-logout" onclick="logout()" data-i18n="logout">Logout</button>
      </div>
    </div>

    <div class="dashboard-section">
      <div id="subscriptionWidgetContainer" class="sub-widget">
         <div>
            <div style="color: var(--text-muted); font-size: 12px; text-transform: uppercase;">Current Plan</div>
            <div class="sub-info"><strong id="subWidgetPlan">-</strong></div>
         </div>
         <div>
            <div style="color: var(--text-muted); font-size: 12px; text-transform: uppercase;">Days Remaining</div>
            <div class="sub-info" id="subWidgetDays">-</div>
         </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card" onclick="location.href='view_employees.html'">
          <div class="stat-value" id="totalEmployees">0</div>
          <div class="stat-label">Total Employees</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="presentToday">0</div>
          <div class="stat-label">Present Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="absentToday">0</div>
          <div class="stat-label">Absent Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pendingRequests">0</div>
          <div class="stat-label">Pending Requests</div>
        </div>
      </div>

      <div class="card" id="attendanceCard">
        <h3>Today's Report</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Employee Name</th>
                <th>Status</th>
                <th>Punch In</th>
                <th>Punch Out</th>
                <th>Work Status</th>
                <th>Daily Price</th>
              </tr>
            </thead>
            <tbody id="recentAttendance"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADjMc3Jwsjlg_ajo282ZtM5jvDUuGdoRk",
      authDomain: "payflowpro-6e62d.firebaseapp.com",
      databaseURL: "https://payflowpro-6e62d-default-rtdb.firebaseio.com",
      projectId: "payflowpro-6e62d",
      storageBucket: "payflowpro-6e62d.firebasestorage.app",
      messagingSenderId: "69298740438",
      appId: "1:69298740438:web:18fd85e982e083e1543d77"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const companyId = localStorage.getItem("companyId");

    if (localStorage.getItem("admin") !== "true") { location = "index.html"; }

    window.logout = () => { localStorage.clear(); location = "index.html"; };
    window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('open'); };

    async function fetchData() {
       const today = new Date().toISOString().split('T')[0];
       
       const [empSnap, attSnap, leaveSnap, currencySnap] = await Promise.all([
          get(ref(db, "employees")),
          get(ref(db, "attendance")),
          get(ref(db, "leaveRequests")),
          get(ref(db, "settings/currencySymbol"))
       ]);

       const currency = currencySnap.val() || "₹";
       const allAtt = attSnap.val() || {};
       const employees = [];
       if (empSnap.exists()) {
          empSnap.forEach(c => {
             if (c.val().companyId === companyId) {
                const e = c.val(); e.empId = c.key;
                employees.push(e);
             }
          });
       }

       let present = 0;
       const tbody = document.getElementById('recentAttendance');
       tbody.innerHTML = "";

       employees.forEach(emp => {
          const dayData = (allAtt[emp.empId] && allAtt[emp.empId][today]) ? allAtt[emp.empId][today] : {};
          const status = dayData.status || 'absent';
          const punchIn = dayData.punchIn?.time || '-';
          const punchOut = dayData.punchOut?.time || '-';
          const workStatus = dayData.currentWorkStatus || '-';
          const price = dayData.dailyPrice || 0;

          if (status.toLowerCase() === 'in' || status.toLowerCase() === 'out') present++;

          tbody.innerHTML += `
             <tr>
                <td>${emp.name}</td>
                <td><span class="badge-${status.toLowerCase()}">${status}</span></td>
                <td>${punchIn}</td>
                <td>${punchOut}</td>
                <td><i style="color:var(--text-muted); font-size:12px;">${workStatus}</i></td>
                <td>${currency}${price}</td>
             </tr>`;
       });

       document.getElementById('totalEmployees').textContent = employees.length;
       document.getElementById('presentToday').textContent = present;
       document.getElementById('absentToday').textContent = employees.length - present;
       
       let pending = 0;
       if (leaveSnap.exists()) {
          leaveSnap.forEach(c => { if (c.val().status === 'pending') pending++; });
       }
       document.getElementById('pendingRequests').textContent = pending;
    }

    fetchData();
  </script>
  <script src="sidebar.js"></script>
</body>
</html>
