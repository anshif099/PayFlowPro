<!DOCTYPE html>
<html>

<head>
    <title>Teamsive Admin Login</title>
    <script src="lang.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0b0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Segoe UI;
        }

        .box {
            background: #141a22;
            padding: 40px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 40px rgba(0, 255, 180, .2);
        }

        h2 {
            color: #00ffc3;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            background: #0f151d;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ffc3;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2 id="loginTitle" data-i18n="admin_login_header">PayFlowPro Admin</h2>

        <select id="langSelector" onchange="changeLanguage(this.value)"
            style="width:100%; padding:10px; margin-bottom:15px; background:#0f151d; color:white; border:none; border-radius:8px;">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="ar">العربية</option>
            <option value="de">Deutsch</option>
            <option value="ml">Malayalam</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="te">తెలుగు (Telugu)</option>
        </select>

        <div id="idStep">
            <input type="text" id="adminIdInput" placeholder="Admin ID / Email">
            <button onclick="verifyId()">Continue</button>
        </div>

        <div id="passwordStep" style="display:none;">
            <p id="welcomeMsg" style="color: #00ffc3; text-align: center; margin-bottom: 15px; font-weight: 500;"></p>
            <input type="password" id="password" data-i18n="password_placeholder" placeholder="Password">
            <button onclick="login()" data-i18n="login">Login</button>
            <button onclick="resetFlow()"
                style="background:transparent; color: #8b92a0; margin-top: 10px; font-size: 13px;">Use different
                ID</button>
        </div>

        <div id="createPasswordStep" style="display:none;">
            <p id="createMsg" style="color: #00ffc3; text-align: center; margin-bottom: 15px; font-weight: 500;">Set
                your password</p>
            <input type="password" id="newPassword" placeholder="New Password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <button onclick="createPassword()">Create Password</button>
            <button onclick="resetFlow()"
                style="background:transparent; color: #8b92a0; margin-top: 10px; font-size: 13px;">Use different
                ID</button>
        </div>
        <p class="error" id="error"></p>
    </div>

    <script type="module">
        import {
            initializeApp
        }

            from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            get,
            update
        }

            from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADjMc3Jwsjlg_ajo282ZtM5jvDUuGdoRk",
            authDomain: "payflowpro-6e62d.firebaseapp.com",
            databaseURL: "https://payflowpro-6e62d-default-rtdb.firebaseio.com",
            projectId: "payflowpro-6e62d",
            storageBucket: "payflowpro-6e62d.firebasestorage.app",
            messagingSenderId: "69298740438",
            appId: "1:69298740438:web:18fd85e982e083e1543d77"
        }

            ;

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const SUPER_ADMIN_ID = "Teamsive";
        const SUPER_ADMIN_PASS = "Teamsive@123";

        let verifiedAdmin = null;
        let verifiedKey = null;

        // Pre-fetch settings before redirecting to prevent theme loading delay on next page
        async function prefetchTheme() {
            try {
                const snap = await get(ref(db, 'settings'));
                if (snap.exists()) {
                    const data = snap.val();
                    if (data.primaryColor) localStorage.setItem('admin_primary_color', data.primaryColor);
                    if (data.secondaryColor) localStorage.setItem('admin_secondary_color', data.secondaryColor);
                    else localStorage.removeItem('admin_secondary_color');
                    if (data.companyLogo?.url) localStorage.setItem('admin_logo_url', data.companyLogo.url);
                    else localStorage.removeItem('admin_logo_url');
                }
            } catch (e) { console.error('Prefetch error:', e); }
        }

        window.resetFlow = () => {
            document.getElementById("idStep").style.display = "block";
            document.getElementById("passwordStep").style.display = "none";
            document.getElementById("createPasswordStep").style.display = "none";
            document.getElementById("error").innerText = "";
            document.getElementById("adminIdInput").value = "";
            verifiedAdmin = null;
            verifiedKey = null;
        }

        window.verifyId = async () => {
            const input = document.getElementById("adminIdInput").value.trim();
            const errorEl = document.getElementById("error");
            if (!input) return;

            errorEl.innerText = t('login_checking');

            // 1. Check Hardcoded Super Admin
            if (input === SUPER_ADMIN_ID) {
                document.getElementById("idStep").style.display = "none";
                document.getElementById("passwordStep").style.display = "block";
                document.getElementById("welcomeMsg").innerText = "Welcome, Super Admin";
                errorEl.innerText = "";

                verifiedAdmin = {
                    role: 'super_admin', name: 'Teamsive'
                }

                    ;
                return;
            }

            // 2. Check Firebase
            try {
                const snapshot = await get(ref(db, 'admins'));
                let found = false;

                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const admin = child.val();

                        const adminEmail = (admin.email || "").trim().toLowerCase();
                        const aId = (admin.adminId || "").trim().toLowerCase();
                        const cId = (admin.companyId || "").trim().toLowerCase();
                        const searchInput = input.toLowerCase();
                        const adminKey = (child.key || "").trim().toLowerCase();

                        if (adminEmail === searchInput || aId === searchInput || cId === searchInput || adminKey === searchInput) {
                            found = true;
                            verifiedAdmin = admin;
                            verifiedKey = child.key;

                            if (admin.status === 'inactive') {
                                errorEl.innerText = "Account Disabled. Contact Super Admin.";
                                return;
                            }

                            document.getElementById("idStep").style.display = "none";

                            if (admin.password) {
                                document.getElementById("passwordStep").style.display = "block";
                                document.getElementById("welcomeMsg").innerText = "Welcome, " + (admin.name || "Admin");
                            } else {
                                document.getElementById("createPasswordStep").style.display = "block";
                            }

                            errorEl.innerText = "";
                        }
                    });
                }

                if (!found) {
                    // Try searching companies node for adminEmail match
                    const compSnap = await get(ref(db, 'companies'));
                    if (compSnap.exists()) {
                        compSnap.forEach(child => {
                            const c = child.val();
                            if ((c.adminEmail || "").trim().toLowerCase() === input.toLowerCase()) {
                                found = true;
                                verifiedAdmin = {
                                    email: (c.adminEmail || "").trim(),
                                    name: (c.companyName || "Admin").trim(),
                                    role: 'company_admin',
                                    companyId: (c.companyId || child.key).trim(),
                                    companyName: (c.companyName || "").trim(),
                                    password: c.password || "" // Use company password if exists
                                };
                                verifiedKey = null; // Mark as synthesized from company

                                document.getElementById("idStep").style.display = "none";
                                if (verifiedAdmin.password) {
                                    document.getElementById("passwordStep").style.display = "block";
                                    document.getElementById("welcomeMsg").innerText = "Welcome, " + verifiedAdmin.name;
                                } else {
                                    document.getElementById("createPasswordStep").style.display = "block";
                                }
                                errorEl.innerText = "";
                            }
                        });
                    }
                }

                if (!found) {
                    errorEl.innerText = "Admin ID or Email not found";
                }
            } catch (err) {
                errorEl.innerText = "Error: " + err.message;
            }
        }

        window.login = async () => {
            const p = document.getElementById("password").value;
            const errorEl = document.getElementById("error");

            if (verifiedAdmin.role === 'super_admin') {
                if (p === SUPER_ADMIN_PASS) {
                    localStorage.setItem("admin", "true");
                    localStorage.setItem("role", "super_admin");
                    localStorage.setItem("name", "Teamsive");
                    localStorage.setItem("companyId", "teamsive");
                    localStorage.setItem("companyName", "Teamsive HQ");
                    await prefetchTheme();
                    location.href = "dashboard.html";
                }

                else {
                    errorEl.innerText = "Invalid Password";
                }

                return;
            }

            if (verifiedAdmin) {
                // Determine password match
                let passwordMatched = false;
                if (verifiedAdmin.password && verifiedAdmin.password === p) {
                    passwordMatched = true;
                } else if (verifiedKey) {
                   // Double check in Firebase just in case state is stale
                   try {
                       const snap = await get(ref(db, `admins/${verifiedKey}/password`));
                       if (snap.exists() && snap.val() === p) passwordMatched = true;
                   } catch(e) {}
                } else if (verifiedAdmin.companyId) {
                   // Check companies node for synthesized admins
                   try {
                       const snap = await get(ref(db, `companies/${verifiedAdmin.companyId}/password`));
                       if (snap.exists() && snap.val() === p) passwordMatched = true;
                   } catch(e) {}
                }

                if (!passwordMatched) {
                    errorEl.innerText = "Invalid Password";
                    return;
                }

                // Determine companyId and role if it's missing
                let finalCompanyId = (verifiedAdmin.companyId || '').trim();
                let finalCompanyName = (verifiedAdmin.companyName || '').trim();
                let finalRole = verifiedAdmin.role || '';
                let adminEmail = (verifiedAdmin.email || '').trim().toLowerCase();
                if (!adminEmail && verifiedAdmin.email) adminEmail = verifiedAdmin.email.toLowerCase(); // synthesized

                // FALLBACK: Always check companies node to ensure Company Admins are not accidentally downgraded by faulty admins records
                if (true) {
                    try {
                        const compSnap = await get(ref(db, 'companies'));
                        if (compSnap.exists()) {
                            compSnap.forEach(child => {
                                const c = child.val();
                                if ((c.adminEmail || "").trim().toLowerCase() === adminEmail) {
                                    finalCompanyId = (c.companyId || child.key).trim();
                                    finalCompanyName = (c.companyName || finalCompanyId).trim();
                                    finalRole = 'company_admin'; 
                                }
                            });
                        }
                    } catch (e) {
                        console.error("Error finding company:", e);
                    }
                }

                // Default to branch_admin if still no role
                if (!finalRole) finalRole = 'branch_admin';

                localStorage.setItem("admin", "true");
                localStorage.setItem("role", finalRole);
                localStorage.setItem("branch", (verifiedAdmin.branch || '').trim());
                localStorage.setItem("name", verifiedAdmin.name || 'Admin');
                
                if (finalCompanyId) {
                    localStorage.setItem("companyId", finalCompanyId.toLowerCase());
                }
                if (finalCompanyName) {
                    localStorage.setItem("companyName", finalCompanyName);
                }
                await prefetchTheme();
                location.href = "dashboard.html";
            }

            else {
                errorEl.innerText = "Invalid Password";
            }
        }

        window.createPassword = async () => {
            const p1 = document.getElementById("newPassword").value;
            const p2 = document.getElementById("confirmPassword").value;
            const errorEl = document.getElementById("error");

            if (!p1 || p1.length < 6) {
                errorEl.innerText = "Password must be at least 6 characters";
                return;
            }

            if (p1 !== p2) {
                errorEl.innerText = "Passwords do not match";
                return;
            }

            try {
                errorEl.innerText = "Setting password...";

                if (verifiedKey) {
                    await update(ref(db, 'admins/' + verifiedKey), {
                        password: p1
                    });
                } else if (verifiedAdmin.companyId) {
                    await update(ref(db, 'companies/' + verifiedAdmin.companyId), {
                        password: p1
                    });
                } else {
                    throw new Error("Cannot save password: No record found");
                }
                
                errorEl.innerText = "Password set! Logging in...";

                localStorage.setItem("admin", "true");
                localStorage.setItem("role", verifiedAdmin.role || 'branch_admin');
                localStorage.setItem("branch", verifiedAdmin.branch || '');
                localStorage.setItem("name", verifiedAdmin.name || 'Admin');
                if (verifiedAdmin.companyId) {
                    localStorage.setItem("companyId", verifiedAdmin.companyId.toLowerCase());
                }
                if (verifiedAdmin.companyName) {
                    localStorage.setItem("companyName", verifiedAdmin.companyName);
                }
                await prefetchTheme();
                location.href = "dashboard.html";
            }

            catch (err) {
                errorEl.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
