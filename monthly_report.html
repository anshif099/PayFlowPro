<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Report - PayFlowPro Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="lang.js"></script>
    <style>
        :root {
            --primary: #00ffc3;
            --primary-hover: #00e6af;
            --bg-dark: #0b0f14;
            --bg-card: #141a22;
            --bg-input: #0f151d;
            --text: #ffffff;
            --text-muted: #8b92a0;
            --border: #1e2530;
            --success: #00ffc3;
            --danger: #ff5c5c;
            --warning: #ffa726;
            --sidebar-width: 260px;
        }

        body.light-mode {
            --bg-dark: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #f8f9fa;
            --text: #1a1d21;
            --text-muted: #6c757d;
            --border: #e9ecef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            z-index: 100;
            overflow-y: auto;
            transition: transform .3s ease
        }

        .sidebar-header {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border)
        }

        .sidebar-header h2 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .sidebar-nav {
            margin-top: 24px;
            padding: 0 12px
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .2s ease;
            font-weight: 500;
            font-size: 14px;
            text-decoration: none
        }

        .nav-item:hover {
            background: rgba(0, 255, 195, .08);
            color: var(--primary)
        }

        .nav-item.active {
            background: rgba(0, 255, 195, .15);
            color: var(--primary);
            font-weight: 600
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            font-size: 18px
        }

        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: margin-left .3s ease
        }

        .top-bar {
            background: var(--bg-card);
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50
        }

        .top-bar h1 {
            font-size: 24px;
            font-weight: 600
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 8px
        }

        .dashboard-section {
            padding: 32px
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border)
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 2px solid var(--border);
            background: rgba(0, 0, 0, .2)
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px
        }

        tr:hover {
            background: rgba(0, 255, 195, .03)
        }

        .btn-action {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s ease;
            font-family: inherit
        }

        .btn-logout:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: white
        }

        @media(max-width:768px) {
            .sidebar {
                transform: translateX(-100%)
            }

            .sidebar.open {
                transform: translateX(0)
            }

            .main-content {
                margin-left: 0
            }

            .menu-toggle {
                display: block
            }

            .dashboard-section {
                padding: 20px
            }

            .top-bar {
                padding: 16px 20px
            }
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>💼 PayFlowPro</h2>
            <select id="langSelector" onchange="changeLanguage(this.value)"
                style="margin-top: 10px; background: #1e2530; color: white; border: none; padding: 5px; border-radius: 4px;">
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="de">Deutsch</option>
                <option value="ml">Malayalam</option>
            </select>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
            <a href="employees.html" class="nav-item"><span class="nav-icon">👥</span><span>Employees</span></a>
            <a href="attendance.html" class="nav-item"><span class="nav-icon">✅</span><span>Attendance</span></a>
            <a href="leave_management.html" class="nav-item"><span class="nav-icon">🏖️</span><span>Leave
                    Management</span></a>
            <a href="manage_admins.html" class="nav-item"><span class="nav-icon">🛡️</span><span>Branch
                    Admins</span></a>
            <a href="salary_settings.html" class="nav-item"><span class="nav-icon">💰</span><span>Salary
                    Settings</span></a>
            <a href="monthly_report.html" class="nav-item active"><span class="nav-icon">📑</span><span>Monthly
                    Report</span></a>
            <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div style="display:flex;align-items:center;gap:16px">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 data-i18n="monthly_report">Monthly Report</h1>
            </div>
            <div class="top-bar-actions">
                <button onclick="toggleTheme()"
                    style="background:transparent;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:50%;cursor:pointer">🌓</button>
                <button class="btn-logout" onclick="logout()" data-i18n="logout">Logout</button>
            </div>
        </div>

        <div class="dashboard-section">
            <div class="card">
                <div
                    style="display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
                    <div style="flex:1; min-width: 200px;">
                        <label
                            style="display:block; font-size:13px; color:var(--text-muted); margin-bottom:8px; font-weight:600;"
                            data-i18n="select_month">Select
                            Month</label>
                        <input type="month" id="reportMonth"
                            style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--bg-input); color:white; font-family:inherit;">
                    </div>
                    <div style="flex:0;">
                        <button class="btn-action" onclick="generateReport()" data-i18n="generate_report">Generate
                            Report</button>
                    </div>
                </div>

                <div class="table-container">
                    <table id="reportTable">
                        <thead>
                            <tr>
                                <th data-i18n="employee_name">Employee Name</th>
                                <th data-i18n="employee_id">Employee ID</th>
                                <th data-i18n="total_days">Total Days</th>
                                <th data-i18n="present">Present</th>
                                <th data-i18n="leaves">Leaves</th>
                                <th data-i18n="week_offs">Week Offs</th>
                                <th data-i18n="holidays">Holidays</th>
                                <th data-i18n="attendance_percent">Attendance %</th>
                                <th data-i18n="net_salary">Net Salary</th>
                            </tr>
                        </thead>
                        <tbody id="reportData">
                            <tr>
                                <td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);"
                                    data-i18n="select_month_click">Select
                                    a month and click Generate Report</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADjMc3Jwsjlg_ajo282ZtM5jvDUuGdoRk",
            authDomain: "payflowpro-6e62d.firebaseapp.com",
            databaseURL: "https://payflowpro-6e62d-default-rtdb.firebaseio.com",
            projectId: "payflowpro-6e62d",
            storageBucket: "payflowpro-6e62d.firebasestorage.app",
            messagingSenderId: "69298740438",
            appId: "1:69298740438:web:18fd85e982e083e1543d77"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        if (localStorage.getItem("admin") !== "true") location = "admin.html";
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('open');
        window.logout = () => { localStorage.clear(); location = "admin.html"; };

        // Default to current month
        document.getElementById('reportMonth').value = new Date().toISOString().slice(0, 7);

        window.generateReport = async () => {
            const monthVal = document.getElementById('reportMonth').value;
            if (!monthVal) return alert(t('select_month')); // Using t() for alert if desired, though t() is global now

            const tbody = document.getElementById('reportData');
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">${t('loading_report')}</td></tr>`;

            const adminRole = localStorage.getItem("role");
            const adminBranch = localStorage.getItem("branch");

            try {
                // 1. Fetch Basic Data
                const [empSnap, settingsSnap, attendanceSnap] = await Promise.all([
                    get(ref(db, "employees")),
                    get(ref(db, "settings")),
                    get(ref(db, "attendance"))
                ]);

                if (!empSnap.exists()) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">${t('no_employees_found')}</td></tr>`;
                    return;
                }

                const employees = [];
                empSnap.forEach(c => {
                    const e = c.val();
                    if (adminRole === 'branch_admin' && e.branch !== adminBranch) return;
                    employees.push(e);
                });

                // 2. Month Info
                const year = parseInt(monthVal.split('-')[0]);
                const month = parseInt(monthVal.split('-')[1]);
                const daysInMonth = new Date(year, month, 0).getDate();

                // 3. Settings (WeekOffs & Holidays)
                const weekOffNames = settingsSnap.child("weekOffs").val() || [];
                const allHolidays = settingsSnap.child("holidays").val() || {};

                let monthHolidayCount = 0;
                Object.keys(allHolidays).forEach(dateStr => {
                    if (dateStr.startsWith(monthVal)) monthHolidayCount++;
                });

                let monthWeekOffCount = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(year, month - 1, d);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
                    if (weekOffNames.includes(dayName)) monthWeekOffCount++;
                }

                // 4. Calculate Rows
                let html = "";
                employees.forEach(emp => {
                    const empAtt = attendanceSnap.child(emp.empId);
                    let presentCount = 0;
                    let leaveCount = 0;

                    if (empAtt.exists()) {
                        empAtt.forEach(d => {
                            if (d.key.startsWith(monthVal)) {
                                const status = d.val().status;
                                if (status === 'in') {
                                    presentCount += 1;
                                } else if (status === 'halfday') {
                                    presentCount += 0.5;
                                } else if (status === 'paid-leave' || status === 'sick-leave') {
                                    leaveCount += 1;
                                }
                            }
                        });
                    }

                    const totalPayableDays = presentCount + leaveCount + monthWeekOffCount + monthHolidayCount;
                    const cappedPresent = Math.min(totalPayableDays, daysInMonth);
                    const percent = ((cappedPresent / daysInMonth) * 100).toFixed(1);

                    const baseSalary = parseFloat(emp.salary || 0);
                    const perDay = baseSalary / daysInMonth;
                    const netSalary = Math.round(perDay * cappedPresent);

                    html += `<tr>
                        <td>${emp.name}</td>
                        <td>${emp.empId}</td>
                        <td>${daysInMonth}</td>
                        <td><span style="color:#00ffc3;font-weight:600">${presentCount}</span></td>
                        <td><span style="color:#ffa726;font-weight:600">${leaveCount}</span></td>
                        <td>${monthWeekOffCount}</td>
                        <td>${monthHolidayCount}</td>
                        <td>${percent}%</td>
                        <td><span style="color:#00ffc3;font-weight:700">₹${netSalary.toLocaleString()}</span></td>
                    </tr>`;
                });

                tbody.innerHTML = html || `<tr><td colspan="8" style="text-align:center;">${t('no_matching_records')}</td></tr>`;

            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="8" style="color:var(--danger);text-align:center;">${t('error_loading_report')}: ${e.message}</td></tr>`;
            }
        };

        // Auto-load on open
        generateReport();

    </script>
</body>

</html>
